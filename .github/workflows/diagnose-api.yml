name: Diagnose candidate API hosts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-diagnostics:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Test DNS and actual HGhub POST envelope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $hosts = @('huangguoai.com', 'huangguoai.ai', 'api.hdvip0.com', 'api.hdvip3.com', 'api.hdvip4.com', 'api.hongdou-duanju.com', 'api.hongdou-juchang.com', 'api.hongdou-manju.com', 'm.huangguoduanju.net')
          $rows = @()
          # Public, anonymous, read-only envelope. Never send user credentials or tokens.
          $envelope = @{ method='GET'; path='/'; body=''; content_type='' } | ConvertTo-Json -Compress
          foreach ($hostName in $hosts) {
            $dns = ''
            try {
              $dns = ((Resolve-DnsName -Name $hostName -Type A -ErrorAction Stop | Where-Object IPAddress | Select-Object -ExpandProperty IPAddress) -join ',')
            } catch { $dns = 'DNS_ERROR: ' + $_.Exception.Message }
            foreach ($case in @('root_get', 'edge_post', 'feed_post')) {
              $path = if ($case -eq 'root_get') { '/' } else { '/api/edge/request' }
              $url = 'https://' + $hostName + $path
              $status = ''
              $errorText = ''
              $contentType = ''
              $responseClass = ''
              try {
                $params = @{ Uri=$url; MaximumRedirection=0; TimeoutSec=12; SkipHttpErrorCheck=$true; ErrorAction='Stop' }
                if ($case -ne 'root_get') {
                  $params.Method = 'Post'
                  $params.Body = if ($case -eq 'feed_post') { @{ method='GET'; path='/api/videos?page=1&size=20'; body=''; content_type='' } | ConvertTo-Json -Compress } else { $envelope }
                  $params.ContentType = 'application/json'
                  $params.Headers = @{ Accept='application/json'; Referer=('https://' + $hostName + '/') }
                } else {
                  $params.Method = 'Get'
                }
                $resp = Invoke-WebRequest @params
                $status = [string][int]$resp.StatusCode
                $contentType = [string]$resp.Headers['Content-Type']
                if ($contentType -match 'json') {
                  try {
                    $payload = $resp.Content | ConvertFrom-Json -ErrorAction Stop
                    if ($null -ne $payload.status) { $responseClass = 'business_status:' + [string]$payload.status }
                    elseif ($null -ne $payload.code) { $responseClass = 'business_code:' + [string]$payload.code }
                    else { $responseClass = 'json_no_status' }
                  } catch { $responseClass = 'json_parse_failed' }
                }
              } catch {
                $errorText = $_.Exception.Message
              }
              $rows += [pscustomobject]@{ Host=$hostName; Case=$case; DNS=$dns; HttpStatus=$status; ContentType=$contentType; ResponseClass=$responseClass; Error=$errorText }
            }
          }
          $rows | Format-Table -AutoSize | Out-String -Width 300 | Write-Output
          $rows | ConvertTo-Json -Depth 3 | Set-Content -Path 'network-diagnostics.json' -Encoding utf8
      - name: Upload network diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: network-diagnostics
          path: network-diagnostics.json
          if-no-files-found: error
